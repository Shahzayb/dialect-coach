[pytest]
# Scoped to tests/ deliberately. scripts/smoke_test.py and scripts/pronunciation_test.py
# have test_-prefixed functions but are one-off diagnostics that make real, billable API
# calls — pytest would happily collect them otherwise.
testpaths = tests
# The source root. Modules live under src/ and are imported flat (`import utils`), so
# pytest owns the one mechanism that puts them on sys.path — conftest.py used to do it
# by hand and no longer needs to.
pythonpath = src
filterwarnings =
    # pydub 0.25.1 imports the stdlib audioop, deprecated in 3.12 and gone in 3.13.
    # Upstream, cosmetic, and the reason Python is pinned to 3.12. Not our warning to fix.
    ignore:'audioop' is deprecated:DeprecationWarning
